<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ProxiSpeak - Login</title>

    <link rel="stylesheet" href="css/login.css">

</head>


<body>

    <div class="login-container">

        <div class="login-box">

            <h1>ProxiSpeak</h1>

            <p class="subtitle">
                Virtual Office
            </p>


            <!-- LOGIN FORM -->

            <form id="loginForm">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <!-- LOGIN MESSAGE -->

            <p id="loginMessage"></p>


            <!-- DEMO LOGIN -->

            <button
                id="demoButton"
                class="demo-button"
                type="button"
            >
                Continue as Demo User
            </button>

        </div>

    </div>


    <!-- LOGIN JAVASCRIPT -->

    <script src="js/login.js"></script>

</body>

</html>
